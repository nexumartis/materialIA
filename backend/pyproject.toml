[project]
name = "presupuesto-vivo-backend"
version = "0.1.0"
description = "Presupuesto Vivo — corte vertical de MVP (FastAPI + Supabase Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    # OCR local de comprobantes (app/documents/ocr.py). Fijados: los modelos vienen en el wheel
    # de rapidocr y sus SHA256 se verifican en ocr.MODELS. Ver tools/README.md.
    "rapidocr==3.10.0",
    "onnxruntime==1.31.0",
    "opencv-python-headless>=4.5,<5",
    "pypdfium2==5.14.0",
    "Pillow>=10.1",
]

[project.optional-dependencies]
# reportlab: comprobantes sintéticos y su fuente Vera en tests/test_document_ocr.py.
dev = ["pytest>=8.0", "reportlab==4.4.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
# Sólo `app` es el paquete instalable; `evals/` y `tests/` se corren desde el repo.
include = ["app*"]
