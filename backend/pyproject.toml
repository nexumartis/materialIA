[project]
name = "presupuesto-vivo-backend"
version = "0.1.0"
description = "Presupuesto Vivo — corte vertical de MVP (FastAPI + Supabase Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
# Sólo `app` es el paquete instalable; `evals/` y `tests/` se corren desde el repo.
include = ["app*"]
