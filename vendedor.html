<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oportunidades — Presupuesto Vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/pv.css" />
</head>
<body>

<div class="scrim"></div>

<div class="topbar">
  <button class="menu" type="button" aria-label="Abrir menú">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <b>Oportunidades</b>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="color:var(--accent)" aria-hidden="true">
        <rect x="2.5" y="3.5" width="19" height="17" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <line x1="12" y1="3.5" x2="12" y2="20.5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="7.2" y1="7.2" x2="7.2" y2="16.8" stroke="currentColor" stroke-width="1.5"/>
        <line x1="16.8" y1="7.2" x2="16.8" y2="16.8" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <div><b>Presupuesto Vivo</b><span>Cerramientos a medida</span></div>
    </div>

    <div class="scope">
      <label for="company">Empresa</label>
      <select id="company" aria-label="Elegir empresa">
        <option value="A">A · Cristalería</option>
        <option value="B">B · Aberturas</option>
      </select>
    </div>

    <nav class="nav" aria-label="Secciones">
      <a class="active" href="vendedor.html" aria-current="page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Oportunidades
      </a>
      <a href="sandbox_ui.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v10H9l-5 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Chat demo
      </a>
      <a href="http://127.0.0.1:8077/docs" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        API · Swagger
      </a>
    </nav>

    <div class="sidebar-foot">
      <span class="pill-demo">datos demo / sintéticos</span>
    </div>
  </aside>

  <main class="main">
    <div class="sheet">
      <div class="titlebar">
        <div>
          <h1>Oportunidades</h1>
          <p class="finding" id="finding">Cargando…</p>
        </div>
        <div class="right">
          <span class="stamp" id="stamp"></span>
          <button class="btn ghost sm" id="refresh" type="button">Actualizar</button>
        </div>
      </div>

      <section class="kpis" id="kpis" aria-label="Resumen"></section>

      <div class="tabs" role="tablist" aria-label="Filtrar">
        <button role="tab" id="tab-todas" aria-selected="true" type="button">Todas</button>
        <button role="tab" id="tab-vencidos" aria-selected="false" type="button">Vencidos</button>
      </div>

      <div class="toolbar">
        <span class="count" id="caption">Empresa A</span>
        <span class="right count" id="total"></span>
      </div>

      <div class="tablewrap">
        <table>
          <caption class="sr">Oportunidades por empresa</caption>
          <thead>
            <tr>
              <th scope="col">Fecha</th>
              <th scope="col">Pedido</th>
              <th scope="col">Estado</th>
              <th scope="col" class="num">Importe (ARS)</th>
              <th scope="col">Seguimiento</th>
              <th scope="col" class="num">Guardar</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="note" id="status" role="status" aria-live="polite"></p>
    </div>
  </main>
</div>

<script src="assets/pv-shell.js"></script>
<script>
  const API = (localStorage.getItem("pv_api") || "http://127.0.0.1:8077");
  // claves + etiquetas de etapa (sin color: el color se reserva para lo que pide decisión)
  const STAGES = [
    ["nueva", "Nueva"],
    ["datos_incompletos", "Datos incompletos"],
    ["para_cotizar", "Para cotizar"],
    ["cotizada", "Cotizada"],
    ["seguimiento", "Seguimiento"],
    ["cerrada", "Cerrada"],
  ];
  const STAGE_LABEL = Object.fromEntries(STAGES);
  const $ = (id) => document.getElementById(id);
  const company = () => $("company").value;
  let onlyOver = false;
  let lastList = [];

  const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
  function fmtDate(iso){ try { return new Date(iso).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}); } catch { return "—"; } }
  function dateOnly(iso){ return iso ? String(iso).slice(0,10) : ""; }
  function isOverdue(o){
    if(!o.next_action_at || o.stage === "cerrada") return false;
    const d = new Date(dateOnly(o.next_action_at) + "T23:59:59");
    return d < new Date();
  }
  function pedidoText(req){
    if(!req || !Object.keys(req).length) return { main:"Consulta general", sub:"" };
    const cat = req.category || "pedido";
    const tc  = [req.tipo, req.color].filter(Boolean).join(" ");
    const med = (req.ancho_mm && req.alto_mm) ? `${req.ancho_mm}×${req.alto_mm} mm` : "";
    const extra = [req.localidad, req.customer_name].filter(Boolean).join(" · ");
    return { main: `${cap(cat)} ${tc}`.trim(), sub: [med, extra].filter(Boolean).join(" · ") };
  }

  function skeleton(){
    $("kpis").innerHTML = "";
    $("rows").innerHTML = `<tr><td colspan="6" style="padding:0">${'<div class="skel"></div>'.repeat(5)}</td></tr>`;
  }

  function renderKpis(list){
    const count = (s) => list.filter(o => o.stage === s).length;
    const overdue = list.filter(isOverdue).length;
    const tiles = [
      ["Total", list.length, false],
      ["Vencidas", overdue, overdue > 0],
      ["Para cotizar", count("para_cotizar"), false],
      ["Cerradas", count("cerrada"), false],
    ];
    $("kpis").innerHTML = tiles.map(([l,n,neg]) =>
      `<div class="kpi"><div class="l">${l}</div><div class="n num${neg?' neg':''}">${n}</div></div>`).join("");
  }

  function renderRows(list){
    const tb = $("rows");
    tb.innerHTML = "";
    if(!list.length){
      const msg = onlyOver
        ? "No hay oportunidades con seguimiento vencido."
        : "Todavía no hay oportunidades para esta empresa. Generá una desde el Chat demo.";
      tb.innerHTML = `<tr><td colspan="6"><div class="state" role="status">${msg}</div></td></tr>`;
      return;
    }
    for(const o of list){
      const p = pedidoText(o.requirements);
      const tr = document.createElement("tr");
      tr.dataset.id = o.id;
      const opts = STAGES.map(([k,label]) =>
        `<option value="${k}" ${k===o.stage?"selected":""}>${label}</option>`).join("");
      tr.innerHTML = `
        <td class="num">${fmtDate(o.created_at)}</td>
        <td class="pedido"><b>${p.main || "Consulta"}</b><small>${p.sub || ""}</small></td>
        <td><select class="stage-select" aria-label="Estado de la oportunidad">${opts}</select></td>
        <td class="num"><input class="amount-input num" type="number" min="0" step="1000" placeholder="—"
               value="${o.estimated_amount ?? ""}" aria-label="Importe estimado en pesos" /></td>
        <td>
          <input class="date-input" type="date" value="${dateOnly(o.next_action_at)}" aria-label="Fecha de seguimiento" />
          ${isOverdue(o) ? '<span class="pill neg">Vencido</span>' : ''}
        </td>
        <td class="actions-cell">
          <button class="btn sm" type="button">Guardar</button>
          <span class="rowmsg" aria-live="polite"></span>
        </td>`;
      if (isOverdue(o)) tr.classList.add("overdue");
      tr.querySelector("button").addEventListener("click", () => saveRow(tr, o.id));
      tb.appendChild(tr);
    }
  }

  function renderView(){
    renderKpis(lastList);
    const overdue = lastList.filter(isOverdue).length;
    $("finding").innerHTML = overdue
      ? `<b>${overdue}</b> ${overdue===1?'oportunidad necesita':'oportunidades necesitan'} seguimiento hoy. Su fecha ya venció.`
      : "Ningún seguimiento vencido. Todo al día.";
    $("tab-vencidos").textContent = `Vencidos ${overdue ? overdue : ""}`.trim();
    $("tab-todas").setAttribute("aria-selected", String(!onlyOver));
    $("tab-vencidos").setAttribute("aria-selected", String(onlyOver));
    const list = onlyOver ? lastList.filter(isOverdue) : lastList;
    $("total").textContent = `${list.length} ${list.length===1?'oportunidad':'oportunidades'}`;
    renderRows(list);
  }

  async function load(){
    skeleton();
    $("status").textContent = "";
    $("caption").textContent = "Empresa " + $("company").selectedOptions[0].textContent.replace(/^./, c=>c);
    try {
      const r = await fetch(`${API}/sandbox/opportunities?company=${company()}`);
      if(!r.ok) throw new Error("HTTP "+r.status);
      lastList = await r.json();
      renderView();
      $("stamp").textContent = "Actualizado " + new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    } catch(e){
      lastList = [];
      $("kpis").innerHTML = "";
      $("finding").textContent = "Sin conexión con la API.";
      $("total").textContent = "";
      $("rows").innerHTML = `<tr><td colspan="6"><div class="state err" role="alert">
        <span class="pill neg">Sin conexión</span><br>
        No pude conectar con la API (${API}). ¿Está corriendo el server?
        <br><button class="btn sm" type="button" style="margin-top:12px" onclick="load()">Reintentar</button></div></td></tr>`;
    }
  }

  async function saveRow(tr, id){
    const stage = tr.querySelector("select").value;
    const amountRaw = tr.querySelector(".amount-input").value;
    const segRaw = tr.querySelector('input[type=date]').value;
    const btn = tr.querySelector("button");
    const msg = tr.querySelector(".rowmsg");
    const body = { stage };
    if(amountRaw !== "") body.estimated_amount = Number(amountRaw);
    if(segRaw !== "") body.next_action_at = segRaw;
    btn.disabled = true; msg.textContent = "Guardando…"; msg.style.color = "var(--muted)";
    try {
      const r = await fetch(`${API}/sandbox/opportunities/${id}?company=${company()}`, {
        method: "PATCH", headers: {"content-type":"application/json"}, body: JSON.stringify(body),
      });
      if(!r.ok) throw new Error("HTTP "+r.status);
      msg.textContent = "Guardado"; msg.style.color = "var(--positive)";
      tr.classList.remove("saved"); void tr.offsetWidth; tr.classList.add("saved");
      load().then(() => $("status").textContent = `Oportunidad actualizada (${STAGE_LABEL[stage]||stage}).`);
    } catch(e){
      msg.textContent = "Error"; msg.style.color = "var(--negative)";
    } finally { btn.disabled = false; }
  }

  $("company").addEventListener("change", load);
  $("refresh").addEventListener("click", load);
  $("tab-todas").addEventListener("click", () => { onlyOver = false; renderView(); });
  $("tab-vencidos").addEventListener("click", () => { onlyOver = true; renderView(); });
  load();
</script>
</body>
</html>
